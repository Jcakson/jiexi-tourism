<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,

               maximum-scale=1.0,
               user-scalable=no">

<title>揭西县游客画像驱动旅游路线 Demo</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>


<style>

/* =====================================================
   基础
===================================================== */

html,
body {

    height:100%;
    margin:0;
    padding:0;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

}


/* =====================================================
   地图
===================================================== */

#map {

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

}


/* =====================================================
   控制面板
===================================================== */

.panel {

    position:absolute;

    z-index:1000;

    top:12px;
    left:12px;

    width:340px;

    max-height:
        calc(100vh - 30px);

    overflow-y:auto;

    background:
        rgba(255,255,255,.96);

    padding:16px 18px;

    border-radius:12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.20);

    line-height:1.55;

}


/* =====================================================
   标题
===================================================== */

.panel h2 {

    margin:
        0 0 4px 0;

    font-size:21px;

}

.panel h3 {

    margin:
        14px 0 7px 0;

    font-size:15px;

}


/* =====================================================
   游客画像按钮
===================================================== */

.profile-buttons {

    display:flex;

    flex-wrap:wrap;

    gap:5px;

}

button {

    border:0;

    padding:
        8px 11px;

    margin:0;

    border-radius:7px;

    cursor:pointer;

    background:#eeeeee;

    transition:.15s;

    font-size:13px;

}

button:hover {

    background:#dddddd;

}

button.active {

    background:#333;

    color:white;

}


/* =====================================================
   起点设置
===================================================== */

.start-setting {

    padding:
        10px;

    background:#f7f7f7;

    border-radius:8px;

}

.start-row {

    display:flex;

    align-items:center;

    gap:7px;

    margin-bottom:8px;

}

.start-row input {

    width:17px;
    height:17px;

}

.start-row label {

    font-size:13px;

    font-weight:bold;

}

select {

    width:100%;

    padding:9px;

    margin-top:4px;

    border:
        1px solid #ccc;

    border-radius:6px;

    background:white;

    font-size:13px;

}


/* =====================================================
   推荐结果
===================================================== */

.result-box {

    margin-top:12px;

    padding:10px;

    background:#f7f7f7;

    border-radius:8px;

    font-size:13px;

}


/* =====================================================
   Day
===================================================== */

.day-box {

    margin-top:10px;

    padding:10px;

    background:white;

    border-left:
        4px solid #333;

    border-radius:5px;

    box-shadow:
        0 1px 5px rgba(0,0,0,.08);

}

.day-title {

    font-weight:bold;

    margin-bottom:6px;

    font-size:14px;

}


/* =====================================================
   路线节点
===================================================== */

.route-place {

    padding:
        3px 0;

}

.route-place.start {

    font-weight:bold;

}

.route-place.stay {

    color:#1769aa;

    font-weight:bold;

}

.route-arrow {

    color:#888;

    margin-right:4px;

}


/* =====================================================
   住宿提示
===================================================== */

.overnight {

    margin-top:8px;

    padding:8px;

    background:#eef6ff;

    border-radius:6px;

    color:#1769aa;

}


/* =====================================================
   起点提示
===================================================== */

.start-info {

    margin-top:8px;

    padding:8px;

    background:#fff8e6;

    border-radius:6px;

    color:#8a5a00;

}


/* =====================================================
   图例
===================================================== */

.legend {

    margin-top:12px;

    font-size:12px;

}

.legend-row {

    margin:5px 0;

}

.legend-dot {

    display:inline-block;

    width:12px;
    height:12px;

    border-radius:50%;

    margin-right:5px;

    vertical-align:middle;

}


/* =====================================================
   提示文字
===================================================== */

.note {

    font-size:11px;

    color:#666;

    margin-top:12px;

    line-height:1.5;

}


/* =====================================================
   tooltip
===================================================== */

.node-tooltip {

    min-width:230px;

    max-width:300px;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    line-height:1.55;

}

.node-tooltip h4 {

    margin:
        0 0 6px 0;

    font-size:15px;

}

.tag {

    display:inline-block;

    background:#eee;

    padding:
        2px 6px;

    border-radius:4px;

    margin:
        2px 2px 5px 0;

    font-size:11px;

}


/* =====================================================
   手机端
===================================================== */

@media (max-width:700px) {

    #map {

        height:
            58vh;

    }


    .panel {

        position:absolute;

        top:auto;
        left:0;
        bottom:0;

        width:100%;

        max-height:
            42vh;

        box-sizing:border-box;

        padding:
            12px 14px;

        border-radius:
            14px 14px 0 0;

        overflow-y:auto;

        box-shadow:
            0 -3px 15px rgba(0,0,0,.20);

    }


    .panel h2 {

        font-size:18px;

    }


    .panel h3 {

        margin-top:10px;

        font-size:14px;

    }


    button {

        padding:
            7px 9px;

        font-size:12px;

    }


    .result-box {

        font-size:12px;

        margin-top:8px;

        padding:8px;

    }


    .day-box {

        margin-top:7px;

        padding:8px;

    }


    .note,
    .legend {

        font-size:10px;

    }

}


/* =====================================================
   更小手机
===================================================== */

@media (max-width:430px) {

    #map {

        height:55vh;

    }

    .panel {

        max-height:45vh;

    }

}

</style>

</head>

================================================= -->

<h3>
① 选择游客画像
</h3>


<div class="profile-buttons">

<button id="b1"

文化体验型

</button>


<button id="b2"

生态休闲型

</button>


<button id="b3"

</button>


<button id="b4"

骑行 / 小众

</button>

</div>



<!-- =================================================
     ② 时间
================================================= -->

<h3>
② 选择游玩计划
</h3>


<select id="duration"
        onchange="generateRoute()">

<option value="1">
一天
</option>

<option value="2">
两天一夜
</option>

<option value="3">
三天两夜
</option>

</select>



<!-- =================================================
     ③ 起点
================================================= -->

<h3>
③ 是否设定起始点
</h3>


<div class="start-setting">


<div class="start-row">

<input
    type="checkbox"
    id="useStartPoint"
    onchange="toggleStartPoint()">

<label for="useStartPoint">

设定固定起点

</label>

</div>


<select
    id="startPoint"
    disabled
    onchange="generateRoute()">

<option value="">

请选择起点

</option>

</select>


<div style="
font-size:11px;
color:#777;
margin-top:6px;
">

不设定起点时，
系统根据游客画像自动生成路线。

</div>

</div>



<!-- =================================================
     游客画像
================================================= -->

<div id="profileInfo"

</div>



<!-- =================================================
     路线
================================================= -->

</div>



<!-- =================================================

================================================= -->

</div>


<div class="legend-row">

<span class="legend-dot"

</span>

      style="background:#e69500">
</span>

文化 / 美食

</div>


<div class="legend-row">

<span class="legend-dot"
      style="background:#8a4fff">
</span>

小众 / 骑行

</div>


<div class="legend-row">

<span class="legend-dot"
      style="background:#1769aa">
</span>

住宿节点

</div>

</div>



<!-- =================================================
     说明
================================================= -->

<div class="note">

<b>路线规划逻辑：</b>

<br>

① 根据游客画像匹配旅游资源

<br>

② 根据游玩天数安排每日节点

<br>

③ 多日旅行优先安排住宿节点

<br>

④ 用户设定起点后，从指定起点开始规划

<br>

⑤ 未设定起点时，使用系统推荐起点

<br><br>

地图：
OpenStreetMap

<br>

道路路线：
OSRM

<br><br>

当前为 Demo 数据。
正式版本可接入
“揭西旅游资源综合数据库”。

</div>

/* =====================================================
   13. 计算两个地点的直线距离
===================================================== */

function distance(
    a,
    b
) {


    const lat1 =
        places[a].coord[0];

    const lon1 =
        places[a].coord[1];


    const lat2 =
        places[b].coord[0];

    const lon2 =
        places[b].coord[1];


    const R =
        6371;


    const dLat =
        (lat2-lat1)
        * Math.PI / 180;


    const dLon =
        (lon2-lon1)
        * Math.PI / 180;


    const x =
        Math.sin(dLat/2)
        *
        Math.sin(dLat/2);


    const y =
        Math.cos(
            lat1*Math.PI/180
        )
        *
        Math.cos(
            lat2*Math.PI/180
        )
        *
        Math.sin(dLon/2)
        *
        Math.sin(dLon/2);


    return R *
        2 *
        Math.atan2(
            Math.sqrt(
                x+y
            ),
            Math.sqrt(
                1-x-y
            )
        );

}



/* =====================================================
   14. 寻找住宿节点
===================================================== */

function findBestStay(
    lastPlace,
    usedPlaces
) {


    const stayPlaces =
        Object.keys(places)
        .filter(

            name =>

                places[name].stay &&
                !usedPlaces.includes(name)

        );


    if(
        stayPlaces.length === 0
    )

        return null;


    let best =
        stayPlaces[0];


    let bestDistance =
        distance(
            lastPlace,
            best
        );


    stayPlaces.forEach(

        name => {

            const d =
                distance(
                    lastPlace,
                    name
                );


            if(d < bestDistance) {

                best =
                    name;

                bestDistance =
                    d;

            }

        }

    );


    return best;

}



/* =====================================================
   15. 根据固定起点调整路线
===================================================== */

function adjustRouteForStart(
    routes,
    start
) {


    if(!start)
        return routes;


    /*
     * 如果起点本来就在第一天
     * 就从这个位置开始
     */

    for(
        let d=0;
        d<routes.length;
        d++
    ) {


        const route =
            routes[d];


        const index =
            route.indexOf(start);


        if(index >= 0) {


            const newRoute =
                route.slice(index)
                .concat(
                    route.slice(
                        0,
                        index
                    )
                );


            const newRoutes =
                routes.slice();


            newRoutes[d] =
                newRoute;


            /*
             * 如果不是第一天，
             * 将前面的天移动到后面
             */

            if(d > 0) {

                const before =
                    newRoutes.slice(
                        0,
                        d
                    );

                const after =
                    newRoutes.slice(
                        d
                    );


                return after.concat(
                    before
                );

            }


            return newRoutes;

        }

    }


    /*
     * 如果模板里没有这个起点，
     * 将起点加入第一天最前面
     */

    const newRoutes =
        routes.map(
            r => r.slice()
        );


    newRoutes[0] =
        [
            start,
            ...newRoutes[0]
        ];


    return newRoutes;

}



/* =====================================================
   16. 插入住宿节点
===================================================== */

function ensureOvernightPlaces(
    routes
) {


    const result =
        routes.map(
            r => r.slice()
        );


    const used = [];


    result.forEach(

        day => {

            day.forEach(
                p => used.push(p)
            );

        }

    );


    for(
        let i=0;
        i<result.length-1;
        i++
    ) {


        const day =
            result[i];


        const hasStay =
            day.some(
                p =>
                places[p] &&
                places[p].stay
            );


        if(!hasStay) {


            const last =
                day[day.length-1];


            const stay =
                findBestStay(
                    last,
                    []
                );


            if(
                stay &&
                !day.includes(stay)
            ) {

                /*
                 * 将住宿节点作为当天最后一站
                 */

                day.push(stay);

            }

        }

    }


    return result;

}



/* =====================================================
   17. OSRM 道路路线
===================================================== */

async function getRoadRoute(
    coords,
    day,
    color,
    token
) {


    const coordString =
        coords
        .map(
            p =>
            p[1] + "," + p[0]
        )
        .join(";");


    const url =

        "https://router.project-osrm.org/" +

        "route/v1/driving/" +

        coordString +

        "?overview=full&geometries=geojson";


    try {


        const response =
            await fetch(url);


        if(!response.ok)

            throw new Error(
                "OSRM error"
            );


        const data =
            await response.json();


        if(
            token !== routeToken
        )

            return;


        if(
            data.code === "Ok" &&
            data.routes.length > 0
        ) {


            const route =
                data.routes[0];


            const latlngs =
                route
                .geometry
                .coordinates
                .map(
                    p =>
                    [
                        p[1],
                        p[0]
                    ]
                );


            const line =
                L.polyline(

                    latlngs,

                    {

                        color:color,

                        weight:6,

                        opacity:.85

                    }

                ).addTo(map);


            line.bindPopup(

                "<b>" +
                day +
                "</b><br>" +

                "道路距离：" +

                (
                    route.distance / 1000
                ).toFixed(1) +

                " km<br>" +

                "驾车时间：" +

                Math.round(
                    route.duration / 60
                ) +

                " 分钟"

            );


            routeLayers.push(
                line
            );


        } else {


            drawFallback(
                coords,
                color
            );

        }


    } catch(error) {


        drawFallback(
            coords,
            color
        );

    }

}



/* =====================================================
   18. 备用路线
===================================================== */

function drawFallback(
    coords,
    color
) {


    const line =
        L.polyline(

            coords,

            {

                color:color,

                weight:5,

                opacity:.75,

                dashArray:"8,8"

            }

        ).addTo(map);


    routeLayers.push(
        line
    );

}



/* =====================================================
   19. 生成路线
===================================================== */

function generateRoute() {


    routeToken++;

    const token =
        routeToken;


    clearRoutes();


    const days =
        parseInt(
            document.getElementById(
                "duration"
            ).value
        );


    let routes =
        routeTemplates[
            currentProfile
        ][days];


    if(!routes)

        return;


    /*
     * 复制一份，
     * 避免直接修改模板
     */

    routes =
        routes.map(
            r => r.slice()
        );



    /* =================================================
       获取固定起点
    ================================================= */

    const useStart =
        document.getElementById(
            "useStartPoint"
        ).checked;


    const start =
        useStart
        ? document.getElementById(
            "startPoint"
          ).value
        : "";



    /* =================================================
       固定起点调整
    ================================================= */

    if(start) {

        routes =
            adjustRouteForStart(
                routes,
                start
            );

    }



    /* =================================================
       多日旅行自动加入住宿
    ================================================= */

    if(days > 1) {

        routes =
            ensureOvernightPlaces(
                routes
            );

    }



    /* =================================================
       起点地图标记
    ================================================= */

    if(start) {


        startMarker =
            L.marker(

                places[start].coord,

                {
                    icon:icons.start
                }

            ).addTo(map);


        startMarker.bindPopup(

            "<b>🚩 起始点</b><br>" +
            start

        );

    }



    /* =================================================
       生成文字信息
    ================================================= */

    let info = "";


    info +=

        "<b>" +

        profiles[
            currentProfile
        ].name +

        "</b><br>";


    info +=

        "旅行计划：";


    if(days === 1)

        info += "一天";


    if(days === 2)

        info += "两天一夜";


    if(days === 3)

        info += "三天两夜";


    info += "<br>";



    /* =================================================
       起点说明
    ================================================= */

    if(start) {


        info +=

            "<div class='start-info'>" +

            "🚩 <b>固定起点：</b>" +

            start +

            "</div>";

    } else {


        info +=

            "<div class='start-info'>" +

            "📍 <b>系统自动规划起点</b>" +

            "<br>" +

            "当前路线根据游客画像自动生成。" +

            "</div>";

    }


    info += "<br>";



    /* =================================================
       每一天
    ================================================= */

    routes.forEach(

        (day,index) => {


            const dayName =
                "Day " +
                (index+1);


            info +=

                "<div class='day-box'>" +

                "<div class='day-title'>" +

                dayName +

                "</div>";



            day.forEach(

                (place,index2) => {


                    const p =
                        places[place];


                    let className =
                        "route-place";


                    if(
                        start === place
                    )

                        className +=
                            " start";


                    if(p.stay)

                        className +=
                            " stay";


                    info +=

                        "<div class='" +
                        className +
                        "'>" +


                        "<span class='route-arrow'>" +

                        (
                            index2 === 0
                            ? "📍"
                            : "→"
                        ) +

                        "</span>" +


                        (
                            index2+1
                        ) +

                        ". " +

                        place;



                    if(p.stay) {


                        info +=

                            " 🛏";

                    }


                    info +=

                        "</div>";

                }

            );



            /* =================================================
               住宿
            ================================================= */

            if(
                days > 1 &&
                index < days-1
            ) {


                let overnight =
                    null;


                for(
                    let i=day.length-1;
                    i>=0;
                    i--
                ) {


                    const name =
                        day[i];


                    if(
                        places[name] &&
                        places[name].stay
                    ) {


                        overnight =
                            name;

                        break;

                    }

                }



                if(overnight) {


                    info +=

                        "<div class='overnight'>" +

                        "🛏 <b>推荐过夜：</b>" +

                        overnight +

                        "<br>" +

                        "<span style='font-size:11px;color:#666'>" +

                        "系统将住宿节点作为当天行程结束点，" +

                        "以减少第二天不必要的折返。" +

                        "</span>" +

                        "</div>";

                }

            }



            info +=

                "</div>";

        }

    );



    document.getElementById(
        "routeInfo"
    ).innerHTML =
        info;



    /* =================================================
       绘制道路路线
    ================================================= */

    const colors = [

        "#b22222",

        "#1f5f99",

        "#6a3d9a"

    ];


    routes.forEach(

        (day,index) => {


            const coords =
                day.map(

                    name =>
                    places[name].coord

                );


            getRoadRoute(

                coords,

                "Day " +
                (index+1),

                colors[index],

                token

            );

        }

    );



    /* =================================================
       自动缩放
    ================================================= */

    const all = [];


    routes.forEach(

        day => {

            day.forEach(

                name => {

                    if(
                        places[name]
                    ) {

                        all.push(
                            places[name].coord
                        );

                    }

                }

            );

        }

    );



    if(
        start &&
        places[start]
    ) {

        all.push(
            places[start].coord
        );

    }



    if(all.length > 0) {


        map.fitBounds(

            all,

            {

                padding:[
                    50,
                    50
                ]

            }

        );

    }

}



/* =====================================================
   20. 初始化
===================================================== */

setProfile(
    "culture"
);

</script>
