/* =====================================================
   11. OSRM 道路路线
===================================================== */

async function getRoadRoute(

    coords,
    day,
    color,
    token

) {


    const coordString =

        coords

            .map(

                p =>
                    p[1] +
                    "," +
                    p[0]

            )

            .join(";");


    const url =

        "https://router.project-osrm.org/" +

        "route/v1/driving/" +

        coordString +

        "?overview=full&geometries=geojson";


    try {


        const response =
            await fetch(url);


        if(!response.ok)
            throw new Error(
                "OSRM error"
            );


        const data =
            await response.json();


        if(
            token !== routeToken
        )
            return;


        if(

            data.code === "Ok" &&

            data.routes.length > 0

        ) {


            const route =
                data.routes[0];


            const latlngs =

                route.geometry
                    .coordinates
                    .map(

                        p =>
                            [
                                p[1],
                                p[0]
                            ]

                    );


            const line =

                L.polyline(

                    latlngs,

                    {

                        color:
                            color,

                        weight:
                            6,

                        opacity:
                            .85

                    }

                ).addTo(map);


            line.bindPopup(

                "<b>" +

                day +

                "</b><br>" +

                "道路距离：" +

                (
                    route.distance /
                    1000
                ).toFixed(1) +

                " km<br>" +

                "驾车时间：" +

                Math.round(

                    route.duration /
                    60

                ) +

                " 分钟"

            );


            routeLayers.push(
                line
            );


        } else {


            drawFallback(
                coords,
                color
            );

        }


    } catch(error) {


        drawFallback(
            coords,
            color
        );

    }

}


/* =====================================================
   12. 备用路线
===================================================== */

function drawFallback(

    coords,
    color

) {


    const line =

        L.polyline(

            coords,

            {

                color:
                    color,

                weight:
                    5,

                opacity:
                    .75,

                dashArray:
                    "8,8"

            }

        ).addTo(map);


    routeLayers.push(
        line
    );

}


/* =====================================================
   13. 自动生成路线
===================================================== */

function generateRoute() {


    routeToken++;


    const token =
        routeToken;


    clearRoutes();


    const days =

        parseInt(

            document
                .getElementById(
                    "duration"
                )
                .value

        );


    const routes =

        routeTemplates[
            currentProfile
        ][days];


    if(!routes)
        return;


    let info = "";


    info +=

        "<b>" +

        profiles[
            currentProfile
        ].name +

        "</b><br>";


    info +=
        "旅行计划：";


    if(days === 1)
        info += "一天";


    if(days === 2)
        info += "两天一夜";


    if(days === 3)
        info += "三天两夜";


    info +=
        "<br><br>";


    /* ---------------------------------------------
       每一天
    --------------------------------------------- */

    routes.forEach(

        (day,index) => {


            const dayName =
                "Day " +
                (index + 1);


            info +=

                "<div class='day-box'>" +

                "<div class='day-title'>" +

                dayName +

                "</div>";


            day.forEach(

                (place,index2) => {


                    info +=

                        (index2 + 1) +

                        ". " +

                        place;


                    if(

                        places[
                            place
                        ].stay

                    ) {


                        info +=
                            " 🛏";

                    }


                    info +=
                        "<br>";

                }

            );


            /* -----------------------------------------
               过夜判断
            ----------------------------------------- */

            if(

                days > 1 &&

                index <
                    days - 1

            ) {


                let overnight =
                    null;


                for(

                    let i =
                        day.length - 1;

                    i >= 0;

                    i--

                ) {


                    const name =
                        day[i];


                    if(

                        places[
                            name
                        ].stay

                    ) {


                        overnight =
                            name;

                        break;

                    }

                }


                if(overnight) {


                    info +=

                        "<br>" +

                        "🛏 <b>推荐过夜：</b>" +

                        overnight;


                } else {


                    info +=

                        "<br>" +

                        "🛏 <b>建议：</b>" +

                        "返回城区或附近住宿节点";

                }

            }


            info +=
                "</div>";

        }

    );


    document
        .getElementById(
            "routeInfo"
        )
        .innerHTML =
        info;


    /* ---------------------------------------------
       绘制道路
    --------------------------------------------- */

    const colors = [

        "#b22222",

        "#1f5f99",

        "#6a3d9a"

    ];


    routes.forEach(

        (day,index) => {


            const coords =

                day.map(

                    name =>
                        places[
                            name
                        ].coord

                );


            getRoadRoute(

                coords,

                "Day " +
                    (index + 1),

                colors[index],

                token

            );

        }

    );


    /* ---------------------------------------------
       自动缩放地图
    --------------------------------------------- */

    const all = [];


    routes.forEach(

        day => {


            day.forEach(

                name => {


                    all.push(

                        places[
                            name
                        ].coord

                    );

                }

            );

        }

    );


    if(all.length > 0) {


        map.fitBounds(

            all,

            {

                padding: [

                    60,
                    60

                ]

            }

        );

    }

}
